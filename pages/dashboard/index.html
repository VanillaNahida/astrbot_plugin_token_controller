      function formatHistoryTokenNumber(value, decimals = 2) {
        const tokens = Math.max(0, Math.round(Number(value || 0)));
        if (tokens >= 1000000) return `${(tokens / 1000000).toFixed(decimals)} M`;
        if (tokens >= 1000) return `${(tokens / 1000).toFixed(decimals)} K`;
        return String(tokens);
      }

      function historyHourRangeLabel(startLabel, endLabel) {
        if (!startLabel || startLabel === endLabel) return startLabel || "";
        const startHour = String(startLabel).split(":")[0];
        const endHour = String(endLabel).split(":")[0];
        return `${startHour}-${endHour}`;
      }

      function aggregateHistoryBars(bars, bucketSize) {
        const step = Math.max(1, Number(bucketSize || 1));
        if (step === 1) return bars;
        const result = [];
        for (let index = 0; index < bars.length; index += step) {
          const chunk = bars.slice(index, index + step);
          const tokens = chunk.reduce((sum, bar) => sum + Number(bar.tokens || 0), 0);
          const first = chunk[0] || {};
          const last = chunk[chunk.length - 1] || first;
          result.push({
            label: historyHourRangeLabel(first.label, last.label),
            tokens,
            display: formatHistoryTokenNumber(tokens, 1),
            bucket: first.bucket || "",
            group_id: first.group_id || "",
          });
        }
        return result;
      }

      function historyChartInnerWidth() {
        const style = window.getComputedStyle(historyChart);
        const padding =
          Number.parseFloat(style.paddingLeft || "0") +
          Number.parseFloat(style.paddingRight || "0");
        return Math.max(0, (historyChart.clientWidth || 0) - padding);
      }

      function estimateHistoryValueWidth(bars) {
        const sample = document.createElement("span");
        sample.className = "history-bar-value";
        sample.style.position = "fixed";
        sample.style.visibility = "hidden";
        sample.style.pointerEvents = "none";
        document.body.append(sample);
        let maxWidth = 0;
        bars.forEach((bar) => {
          sample.textContent = bar.display || formatHistoryTokenNumber(bar.tokens || 0, 1);
          maxWidth = Math.max(maxWidth, sample.getBoundingClientRect().width);
        });
        sample.remove();
        return maxWidth + 4;
      }

      function fitsHistoryBars(bars, availableWidth) {
        if (!bars.length) return true;
        const gapWidth = Math.max(0, (bars.length - 1) * 8);
        const slotWidth = (Math.max(0, availableWidth - gapWidth) / bars.length);
        return slotWidth >= estimateHistoryValueWidth(bars);
      }

      function resolveHistoryBarsForViewport(bars) {
        if (state.history.range !== "24h" || !state.history.selectedGroupId) {
          return bars;
        }
        const availableWidth = historyChartInnerWidth();
        if (!availableWidth) return aggregateHistoryBars(bars, 4);
        const twoHourBars = aggregateHistoryBars(bars, 2);
        if (fitsHistoryBars(twoHourBars, availableWidth)) return twoHourBars;
        const threeHourBars = aggregateHistoryBars(bars, 3);
        if (fitsHistoryBars(threeHourBars, availableWidth)) return threeHourBars;
        return aggregateHistoryBars(bars, 4);
      }

      function hideHistoryTooltip() {
        historyTooltip.classList.remove("open");
      }

      function showHistoryTooltip(bar, event) {
        const valueText = bar.display || formatTokenNumber(bar.tokens || 0);
        historyTooltipLabel.textContent = bar.label || "";
        historyTooltipValue.textContent = valueText;
        historyTooltip.classList.add("open");

        const margin = 10;
        const offset = 14;
        const rect = historyTooltip.getBoundingClientRect();
        let left = event.clientX + offset;
        let top = event.clientY + offset;
        if (left + rect.width + margin > window.innerWidth) {
          left = event.clientX - rect.width - offset;
        }
        if (top + rect.height + margin > window.innerHeight) {
          top = event.clientY - rect.height - offset;
        }
        historyTooltip.style.left = `${Math.max(margin, left)}px`;
        historyTooltip.style.top = `${Math.max(margin, top)}px`;
      }

      function renderHistoryChart() {
        hideHistoryTooltip();
        const bars = resolveHistoryBarsForViewport(state.history.bars || []);
        historyChart.innerHTML = "";
        historyXAxis.innerHTML = "";
        historyYAxis.innerHTML = "";

        if (!bars.length) {
          historyYAxis.append(document.createElement("span"));
          const empty = document.createElement("div");
          empty.className = "history-empty";
          empty.textContent = "暂无历史 token 用量";
          historyChart.append(empty);
          historyFooter.textContent = state.history.syncedAt
            ? `最后同步：${formatDate(state.history.syncedAt)}`
            : "";
          return;
        }

        const maxValue = Math.max(...bars.map((bar) => Number(bar.tokens || 0)), 1);
        [maxValue, Math.round(maxValue / 2), 0].forEach((value) => {
          const label = document.createElement("span");
          label.textContent = formatTokenNumber(value);
          historyYAxis.append(label);
        });

        const labelStep = bars.length > 16 ? Math.ceil(bars.length / 12) : 1;
        bars.forEach((bar, index) => {
          const item = document.createElement("div");
          item.className = "history-bar-item";

          const value = document.createElement("div");
          value.className = "history-bar-value";
          value.textContent = bar.display || formatTokenNumber(bar.tokens || 0);

          const column = document.createElement("div");
          column.className = "history-bar";
          column.title = `${bar.label}: ${value.textContent}`;
          column.style.height = "0%";
          column.addEventListener("click", (event) => {
            event.stopPropagation();
            showHistoryTooltip(bar, event);
          });

          item.append(value, column);
          historyChart.append(item);

          const xLabel = document.createElement("div");
          xLabel.className = "history-x-label";
          xLabel.textContent = index % labelStep === 0 ? bar.label : "";
          xLabel.title = bar.label;
          historyXAxis.append(xLabel);

          window.requestAnimationFrame(() => {
            const height = Math.max(2, Math.round((Number(bar.tokens || 0) / maxValue) * 86));
            column.style.height = `${height}%`;
          });
        });

        historyFooter.textContent = state.history.syncedAt
          ? `最后同步：${formatDate(state.history.syncedAt)}`
          : "";
      }

      function formatTokenNumber(value) {
        const tokens = Math.max(0, Number(value || 0));
        if (tokens >= 1000000) return `${(tokens / 1000000).toFixed(2)} M`;
        if (tokens >= 1000) return `${(tokens / 1000).toFixed(2)} K`;
        return String(Math.round(tokens));
      }

      async function loadHistory() {
        const params = {
          range: state.history.range || "24h",
        };
        if (state.history.selectedGroupId) {
          params.group_id = state.history.selectedGroupId;
        }
        const payload = await api.apiGet("history", params);
        state.history.groups = payload.groups || [];
        state.history.selectedGroupId = payload.selected_group_id || "";
        state.history.range = payload.range || state.history.range || "24h";
        state.history.bars = payload.bars || [];
        state.history.rangeTotalTokens = Number(payload.range_total_tokens || 0);
        state.history.rangeTotalDisplay = payload.range_total_display || "";
        state.history.syncedAt = payload.synced_at || "";
        renderHistoryControls();
        renderHistoryTotal();
        renderHistoryChart();
      }

      async function loadUserUsage() {
        const params = {};
        if (state.userUsage.selectedGroupId) {
          params.group_id = state.userUsage.selectedGroupId;
        }
        const payload = await api.apiGet("user-usage", params);
        state.userUsage.groups = payload.groups || [];
        state.userUsage.selectedGroupId = payload.selected_group_id || "";
        state.userUsage.users = payload.users || [];
        state.userUsage.window = payload.window || null;
        state.userUsage.syncedAt = payload.synced_at || "";
        renderUserUsageControls();
        renderUserUsageWindow();
        renderUserUsageChart();
      }

      async function reloadUserUsage() {
        userUsageChart.innerHTML = '<div class="history-empty">加载中...</div>';
        userUsageFooter.textContent = "";
        refreshUserUsageBtn.disabled = true;
        try {
          await loadUserUsage();
        } catch (error) {
          userUsageChart.innerHTML = `<div class="history-empty">${
            error.message || error
          }</div>`;
        } finally {
          refreshUserUsageBtn.disabled = false;
        }
      }

      async function loadConfig() {
        const payload = await api.apiGet("config");
        state.config = payload.config || {};
        state.schema = payload.schema || {};
      }

      async function loadUsage() {
        const payload = await api.apiGet("usage");
        state.lastUsagePayload = payload;
        renderUsage(payload);
      }

      async function openConfig() {
        setToast("");
        await loadConfig();
        state.draft = JSON.parse(JSON.stringify(state.config));
        renderConfigForm();
        overlay.classList.add("open");
      }

      async function openStrategy() {
        setStrategyToast("");
        await loadConfig();
        const policy =
          state.config.over_limit_policy ||
          state.schema.over_limit_policy?.default ||
          {};
        state.strategyDraft = JSON.parse(JSON.stringify(policy));
        state.strategyDraft.action = state.strategyDraft.action || "stop_llm";
        renderStrategyForm();
        strategyOverlay.classList.add("open");
      }

      function closeConfig() {
        overlay.classList.remove("open");
        state.draft = {};
        setToast("");
      }

      function closeStrategy() {
        strategyOverlay.classList.remove("open");
        state.strategyDraft = {};
        setStrategyToast("");
      }

      async function openHistory() {
        state.history.selectedGroupId = "";
        state.history.range = "24h";
        state.history.bars = [];
        state.history.rangeTotalTokens = 0;
        state.history.rangeTotalDisplay = "";
        state.history.syncedAt = "";
        renderHistoryControls();
        renderHistoryTotal();
        historyOverlay.classList.add("open");
        await reloadHistory();
      }

      function closeHistory() {
        historyOverlay.classList.remove("open");
        closeCustomSelects();
        hideHistoryTooltip();
      }

      async function openUserUsage() {
        state.userUsage.selectedGroupId = "";
        state.userUsage.users = [];
        state.userUsage.window = null;
        state.userUsage.syncedAt = "";
        renderUserUsageControls();
        renderUserUsageWindow();
        renderUserUsageChart();
        userUsageOverlay.classList.add("open");
        await reloadUserUsage();
      }

      function closeUserUsage() {
        closeUserDialog();
        userUsageOverlay.classList.remove("open");
        closeCustomSelects();
      }

      function handleHistoryResize() {
        if (
          historyResizeFrame ||
          !historyOverlay.classList.contains("open") ||
          state.history.range !== "24h" ||
          !state.history.selectedGroupId
        ) {
          return;
        }
        historyResizeFrame = window.requestAnimationFrame(() => {
          historyResizeFrame = 0;
          renderHistoryChart();
        });
      }

      function openRemark(groupId, remark) {
        state.currentRemarkGroupId = String(groupId || "");
        remarkTarget.textContent = `QQ 群号：${state.currentRemarkGroupId}`;
        remarkInput.value = remark || "";
        setRemarkToast("");
        remarkOverlay.classList.add("open");
        window.requestAnimationFrame(() => {
          remarkInput.focus();
          remarkInput.select();
        });
      }

      function closeRemark() {
        remarkOverlay.classList.remove("open");
        state.currentRemarkGroupId = "";
        remarkInput.value = "";
        setRemarkToast("");
      }

      async function openGroupSettings(group) {
        state.currentSettingsGroupId = String(group.group_id || "");
        groupSettingsTarget.textContent = `QQ 群号：${groupDisplayText(group)}`;
        groupLimitInput.value = group.primary_limit_tokens ?? group.global_limit_tokens ?? "";
        state.currentSettingsInitialLimit = Number.parseInt(
          groupLimitInput.value || "0",
          10,
        );
        groupOnlyAtBotInput.checked = Boolean(group.only_at_bot_llm);
        state.currentSettingsInitialOnlyAtBot = groupOnlyAtBotInput.checked;
        groupContextLimitInput.checked = Boolean(group.context_limit_05);
        state.currentSettingsInitialContextLimit05 = groupContextLimitInput.checked;
        groupPromptCacheInput.checked = Boolean(group.prompt_cache_key_strategy);
        state.currentSettingsInitialPromptCache = groupPromptCacheInput.checked;
        groupDeepSeekCacheInput.checked = Boolean(group.deepseek_cache_strategy);
        state.currentSettingsInitialDeepSeekCache = groupDeepSeekCacheInput.checked;
        state.currentSettingsCacheWarningTouched = false;
        updateGroupContextLimitValue();
        setGroupSettingsResetEnabled(group.has_custom_limit);
        groupSettingsHint.textContent = group.has_custom_limit
          ? "当前使用该群聊的个性化上限；保存后不会随全局上限变化。"
          : `当前显示全局上限：${group.global_limit_display || group.primary_limit_display || ""}`;
        groupSettingsOverlay.classList.add("open");
        clearGroupSettingsToast();

        try {
          const payload = await api.apiGet("group-settings", {
            group_id: state.currentSettingsGroupId,
          });
          groupLimitInput.value = String(payload.daily_token_limit ?? "");
          state.currentSettingsInitialLimit = Number.parseInt(
            groupLimitInput.value || "0",
            10,
          );
          setGroupSettingsResetEnabled(payload.has_custom_limit);
          groupOnlyAtBotInput.checked = Boolean(payload.only_at_bot_llm);
          state.currentSettingsInitialOnlyAtBot = groupOnlyAtBotInput.checked;
          groupContextLimitInput.checked = Boolean(payload.context_limit_05);
          state.currentSettingsInitialContextLimit05 = groupContextLimitInput.checked;
          groupPromptCacheInput.checked = Boolean(payload.prompt_cache_key_strategy);
          state.currentSettingsInitialPromptCache = groupPromptCacheInput.checked;
          groupDeepSeekCacheInput.checked = Boolean(payload.deepseek_cache_strategy);
          state.currentSettingsInitialDeepSeekCache = groupDeepSeekCacheInput.checked;
          state.currentSettingsCacheWarningTouched = false;
          groupSettingsHint.textContent = payload.has_custom_limit
            ? "当前使用该群聊的个性化上限；保存后不会随全局上限变化。"
            : `当前显示全局上限：${payload.global_daily_token_limit_display || ""}`;
          updateGroupContextLimitValue();
        } catch (error) {
          setGroupSettingsToast(error.message || String(error), true);
        }

        window.requestAnimationFrame(() => {
          groupLimitInput.focus();
          groupLimitInput.select();
        });
      }

      function closeGroupSettings() {
        groupSettingsOverlay.classList.remove("open");
        state.currentSettingsGroupId = "";
        state.currentSettingsInitialLimit = null;
        state.currentSettingsInitialOnlyAtBot = false;
        state.currentSettingsInitialContextLimit05 = false;
        state.currentSettingsInitialPromptCache = false;
        state.currentSettingsInitialDeepSeekCache = false;
        state.currentSettingsCacheWarningTouched = false;
        setGroupSettingsResetEnabled(false);
        groupLimitInput.value = "";
        groupOnlyAtBotInput.checked = false;
        groupContextLimitInput.checked = false;
        groupPromptCacheInput.checked = false;
        groupDeepSeekCacheInput.checked = false;
        groupContextLimitValue.textContent = "";
        groupSettingsHint.textContent = "";
        setGroupSettingsToast("");
      }

      async function saveConfig() {
        try {
          setToast("保存中...");
          const payload = await api.apiPost("config", { config: state.draft });
          state.config = payload.config || {};
          closeConfig();
          await loadUsage();
        } catch (error) {
          setToast(error.message || String(error), true);
        }
      }

      async function saveStrategy() {
        try {
          setStrategyToast("保存中...");
          const payload = await api.apiPost("config", {
            config: {
              ...state.config,
              over_limit_policy: state.strategyDraft,
            },
          });
          state.config = payload.config || {};
          closeStrategy();
          await loadUsage();
        } catch (error) {
          setStrategyToast(error.message || String(error), true);
        }
      }

      async function saveRemark() {
        if (!state.currentRemarkGroupId) return;

        try {
          setRemarkToast("保存中...");
          await api.apiPost("remarks", {
            group_id: state.currentRemarkGroupId,
            remark: remarkInput.value,
          });
          closeRemark();
          await loadUsage();
        } catch (error) {
          setRemarkToast(error.message || String(error), true);
        }
      }

      async function saveGroupSettings() {
        if (!state.currentSettingsGroupId) return;

        try {
          setGroupSettingsToast("保存中...");
          const value = Number.parseInt(groupLimitInput.value || "0", 10);
          const nextValue = Number.isNaN(value) ? 0 : value;
          const nextOnlyAtBot = Boolean(groupOnlyAtBotInput.checked);
          const nextContextLimit05 = Boolean(groupContextLimitInput.checked);
          const nextPromptCache = Boolean(groupPromptCacheInput.checked);
          const nextDeepSeekCache = Boolean(groupDeepSeekCacheInput.checked);
          if (
            nextValue === state.currentSettingsInitialLimit &&
            nextOnlyAtBot === state.currentSettingsInitialOnlyAtBot &&
            nextContextLimit05 === state.currentSettingsInitialContextLimit05 &&
            nextPromptCache === state.currentSettingsInitialPromptCache &&
            nextDeepSeekCache === state.currentSettingsInitialDeepSeekCache
          ) {
            closeGroupSettings();
            return;
          }
          const payload = {
            group_id: state.currentSettingsGroupId,
          };
          if (nextValue !== state.currentSettingsInitialLimit) {
            payload.daily_token_limit = nextValue;
          }
          if (nextOnlyAtBot !== state.currentSettingsInitialOnlyAtBot) {
            payload.only_at_bot_llm = nextOnlyAtBot;
          }
          if (nextContextLimit05 !== state.currentSettingsInitialContextLimit05) {
            payload.context_limit_05 = nextContextLimit05;
          }
          if (nextPromptCache !== state.currentSettingsInitialPromptCache) {
            payload.prompt_cache_key_strategy = nextPromptCache;
          }
          if (nextDeepSeekCache !== state.currentSettingsInitialDeepSeekCache) {
            payload.deepseek_cache_strategy = nextDeepSeekCache;
          }
          await api.apiPost("group-settings", payload);
          closeGroupSettings();
          await loadUsage();
        } catch (error) {
          setGroupSettingsToast(error.message || String(error), true);
        }
      }

      async function resetGroupSettings() {
        if (!state.currentSettingsGroupId || !state.currentSettingsHasCustomLimit) {
          return;
        }

        try {
          setGroupSettingsToast("重置中...");
          await api.apiPost("group-settings", {
            group_id: state.currentSettingsGroupId,
            reset: true,
          });
          closeGroupSettings();
          await loadUsage();
        } catch (error) {
          setGroupSettingsToast(error.message || String(error), true);
        }
      }

      document.getElementById("openConfigBtn").addEventListener("click", openConfig);
      document.getElementById("openStrategyBtn").addEventListener("click", openStrategy);
      document.getElementById("openHistoryBtn").addEventListener("click", openHistory);
      document.getElementById("openUserUsageBtn").addEventListener("click", openUserUsage);
      document.getElementById("cancelBtn").addEventListener("click", closeConfig);
      document.getElementById("saveBtn").addEventListener("click", saveConfig);
      document.getElementById("refreshBtn").addEventListener("click", loadUsage);
      document.getElementById("cancelStrategyBtn").addEventListener("click", closeStrategy);
      document.getElementById("saveStrategyBtn").addEventListener("click", saveStrategy);
      document.getElementById("cancelHistoryBtn").addEventListener("click", closeHistory);
      document
        .getElementById("cancelUserUsageBtn")
        .addEventListener("click", closeUserUsage);
      document
        .getElementById("closeUserDialogBtn")
        .addEventListener("click", closeUserDialog);
      sortUserDialogTokensBtn.addEventListener("click", () => {
        sortUserDialog("tokens");
      });
      sortUserDialogTimeBtn.addEventListener("click", () => {
        sortUserDialog("time");
      });
      refreshUserUsageBtn.addEventListener("click", reloadUserUsage);
      document.getElementById("cancelRemarkBtn").addEventListener("click", closeRemark);
      document.getElementById("saveRemarkBtn").addEventListener("click", saveRemark);
      document
        .getElementById("cancelGroupSettingsBtn")
        .addEventListener("click", closeGroupSettings);
      document
        .getElementById("saveGroupSettingsBtn")
        .addEventListener("click", saveGroupSettings);
      resetGroupLimitBtn.addEventListener("click", resetGroupSettings);
      groupLimitInput.addEventListener("input", updateGroupContextLimitValue);
      groupContextLimitInput.addEventListener("change", updateGroupContextLimitWarning);
      groupPromptCacheInput.addEventListener("change", updateGroupCacheStrategyWarning);
      groupDeepSeekCacheInput.addEventListener("change", updateGroupCacheStrategyWarning);
      groupSelectTrigger.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleCustomSelect(groupSelect);
      });
      groupSelectMenu.addEventListener("click", (event) => {
        event.stopPropagation();
      });
      rangeSelectTrigger.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleCustomSelect(rangeSelect);
      });
      rangeSelectMenu.addEventListener("click", (event) => {
        event.stopPropagation();
      });
      userGroupSelectTrigger.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleCustomSelect(userGroupSelect);
      });
      userGroupSelectMenu.addEventListener("click", (event) => {
        event.stopPropagation();
      });
      document.getElementById("openSponsorBtn").addEventListener("click", openSponsor);
      document.getElementById("cancelSponsorBtn").addEventListener("click", closeSponsor);
      sponsorUserInput.addEventListener("input", onSponsorUserInput);
      document
        .getElementById("openLimitedGroupsBtn")
        .addEventListener("click", openLimitedGroups);
      document
        .getElementById("cancelLimitedGroupsBtn")
        .addEventListener("click", closeLimitedGroups);
      document
        .getElementById("saveLimitedGroupsBtn")
        .addEventListener("click", saveLimitedGroups);
      managedSearch.addEventListener("input", () => {
        state.managed.search = managedSearch.value;
        renderManagedList();
      });
      managedSelectAll.addEventListener("change", () => {
        const query = String(state.managed.search || "").trim().toLowerCase();
        const visible = state.managed.groups.filter((group) =>
          query ? managedSearchText(group).includes(query) : true,
        );
        if (managedSelectAll.checked) {
          visible.forEach((group) => state.managed.selected.add(group.group_id));
        } else {
          visible.forEach((group) => state.managed.selected.delete(group.group_id));
        }
        renderManagedList();
      });
      groupSelectSearch.addEventListener("input", () => {
        state.history.searchQuery = groupSelectSearch.value;
        renderHistoryControls();
      });
      userGroupSelectSearch.addEventListener("input", () => {
        state.userUsage.searchQuery = userGroupSelectSearch.value;
        renderUserUsageControls();
      });
      usageSearch.addEventListener("input", () => {
        state.usageSearchQuery = usageSearch.value;
        if (state.lastUsagePayload) renderUsage(state.lastUsagePayload);
      });
      usageSort.addEventListener("change", () => {
        state.usageSort = usageSort.value;
        if (state.lastUsagePayload) renderUsage(state.lastUsagePayload);
      });
      document
        .getElementById("sponsorAddBtn")
        .addEventListener("click", () => sponsorAction("add", "sponsor_users"));
      document
        .getElementById("sponsorRemoveBtn")
        .addEventListener("click", () => sponsorAction("remove", "sponsor_users"));
      document
        .getElementById("sponsorSuperBtn")
        .addEventListener("click", () => sponsorAction("add", "super_admin_users"));
      document
        .getElementById("sponsorUnsuperBtn")
        .addEventListener("click", () => sponsorAction("remove", "super_admin_users"));
      document.addEventListener("click", () => {
        closeCustomSelects();
        hideHistoryTooltip();
      });
      window.addEventListener("resize", handleHistoryResize);
      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) closeConfig();
      });
      strategyOverlay.addEventListener("click", (event) => {
        if (event.target === strategyOverlay) closeStrategy();
      });
      historyOverlay.addEventListener("click", (event) => {
        if (event.target === historyOverlay) closeHistory();
      });
      userUsageOverlay.addEventListener("click", (event) => {
        if (event.target === userUsageOverlay) closeUserUsage();
      });
      userDialogOverlay.addEventListener("click", (event) => {
        if (event.target === userDialogOverlay) closeUserDialog();
      });
      remarkOverlay.addEventListener("click", (event) => {
        if (event.target === remarkOverlay) closeRemark();
      });
      groupSettingsOverlay.addEventListener("click", (event) => {
        if (event.target === groupSettingsOverlay) closeGroupSettings();
      });
      sponsorOverlay.addEventListener("click", (event) => {
        if (event.target === sponsorOverlay) closeSponsor();
      });
      limitedGroupsOverlay.addEventListener("click", (event) => {
        if (event.target === limitedGroupsOverlay) closeLimitedGroups();
      });
      remarkInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          saveRemark();
        } else if (event.key === "Escape") {
          closeRemark();
        }
      });
      groupLimitInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          saveGroupSettings();
        } else if (event.key === "Escape") {
          closeGroupSettings();
        }
      });
      managedSearch.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          closeLimitedGroups();
        }
      });

      async function init() {
        await api.ready();
        await loadConfig();
        await loadUsage();
      }

      init().catch((error) => {
        usageList.innerHTML = `<div class="empty">${error.message || error}</div>`;
      });
    </script>
  </body>
</html>
