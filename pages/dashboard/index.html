<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QQ 群 Token 流控</title>
    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --panel: #ffffff;
        --text: #18202f;
        --muted: #697386;
        --line: #dce2ea;
        --green: #1f9d72;
        --red: #d84a4a;
        --yellow: #f3c442;
        --yellow-dark: #8a6500;
        --blue: #2d6cdf;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        padding: 24px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(280px, 0.8fr);
        gap: 18px;
        max-width: 1220px;
        margin: 0 auto;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        min-width: 0;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .panel-subtitle {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .usage-list {
        display: grid;
        gap: 16px;
        padding: 20px;
      }

      .usage-row {
        display: grid;
        gap: 8px;
      }

      .usage-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        font-size: 14px;
      }

      .group-info {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .group-text {
        min-width: 0;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }

      .group-id {
        font-weight: 700;
        word-break: break-all;
      }

      .group-remark {
        color: #8a94a6;
        font-size: 13px;
        line-height: 1.3;
        word-break: break-all;
      }

      .usage-value {
        color: var(--muted);
        white-space: nowrap;
      }

      .usage-value.fallback {
        color: #b58100;
        font-weight: 700;
      }

      .usage-value.stopped {
        color: var(--red);
        font-weight: 700;
      }

      .usage-side {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex: 0 0 auto;
      }

      .fallback-tag {
        display: inline-flex;
        align-items: center;
        height: 24px;
        border-radius: 8px;
        border: 1px solid #f0c65a;
        background: #fff4ce;
        color: #8a6500;
        padding: 0 8px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .stop-tag {
        display: inline-flex;
        align-items: center;
        height: 24px;
        border-radius: 8px;
        border: 1px solid #ef9a9a;
        background: #ffe1e1;
        color: #b12f2f;
        padding: 0 8px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .icon-button {
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          color 150ms ease,
          transform 80ms ease;
      }

      .icon-button:hover {
        background: #eaf1ff;
        border-color: #c7d8ff;
        color: var(--blue);
      }

      .icon-button:active {
        background: #d8e5ff;
        border-color: #abc3fb;
        transform: translateY(1px);
      }

      .icon-button svg {
        width: 16px;
        height: 16px;
        stroke-width: 2;
      }

      .progress-track {
        height: 14px;
        overflow: hidden;
        border-radius: 7px;
        background: #edf1f6;
        border: 1px solid #e3e8ef;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--green);
        transition: width 180ms ease;
      }

      .progress-fill.over {
        background: var(--red);
      }

      .progress-fill.fallback {
        background: var(--yellow);
      }

      .progress-fill.stopped {
        background: var(--red);
      }

      .empty {
        padding: 42px 20px;
        text-align: center;
        color: var(--muted);
      }

      .feature-body {
        padding: 20px;
      }

      .config-button {
        width: 100%;
        border: 1px solid #ddb33b;
        background: var(--yellow);
        color: var(--yellow-dark);
        border-radius: 8px;
        padding: 12px 14px;
        cursor: pointer;
        font-weight: 700;
        margin-bottom: 10px;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          color 150ms ease,
          transform 80ms ease;
      }

      .config-button:hover {
        background: #ffd95b;
        border-color: #c99a14;
        color: #5f4600;
      }

      .config-button:active {
        background: #e7b72c;
        border-color: #b28610;
        transform: translateY(1px);
      }

      .strategy-button {
        width: 100%;
        border: 1px solid var(--blue);
        background: var(--blue);
        color: #fff;
        border-radius: 8px;
        padding: 12px 14px;
        cursor: pointer;
        font-weight: 700;
        margin-bottom: 10px;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          transform 80ms ease;
      }

      .strategy-button:hover {
        background: #1f5fcf;
        border-color: #1f5fcf;
      }

      .strategy-button:active {
        background: #194fae;
        border-color: #194fae;
        transform: translateY(1px);
      }

      .status-line {
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(14, 20, 31, 0.42);
        z-index: 20;
      }

      .overlay.open {
        display: flex;
      }

      .overlay.compact .modal {
        width: min(420px, 100%);
        max-height: calc(100vh - 48px);
      }

      .modal {
        width: min(980px, 100%);
        max-height: min(760px, calc(100vh - 48px));
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        background: #fff;
        border-radius: 8px;
        border: 1px solid var(--line);
        box-shadow: 0 18px 46px rgba(11, 18, 32, 0.22);
        overflow: hidden;
      }

      .modal-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }

      .modal-title {
        font-size: 16px;
        font-weight: 700;
      }

      .modal-actions {
        display: flex;
        gap: 8px;
      }

      .action-button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        padding: 8px 13px;
        cursor: pointer;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          color 150ms ease,
          transform 80ms ease;
      }

      .action-button:hover {
        background: #eef4ff;
        border-color: #bfd0f2;
        color: #1d57bb;
      }

      .action-button:active {
        background: #dde9ff;
        border-color: #9eb9ee;
        transform: translateY(1px);
      }

      .action-button.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }

      .action-button.primary:hover {
        background: #1f5fcf;
        border-color: #1f5fcf;
        color: #fff;
      }

      .action-button.primary:active {
        background: #194fae;
        border-color: #194fae;
      }

      .action-button:disabled,
      .action-button:disabled:hover,
      .action-button:disabled:active {
        background: #f3f4f6;
        border-color: #d1d5db;
        color: #9ca3af;
        cursor: not-allowed;
        transform: none;
      }

      .modal-content {
        overflow: auto;
        padding: 4px 18px 18px;
      }

      .config-row {
        display: grid;
        grid-template-columns: minmax(220px, 0.85fr) minmax(260px, 1fr);
        gap: 20px;
        align-items: start;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }

      .config-row:last-child {
        border-bottom: 0;
      }

      .config-name {
        font-weight: 700;
        margin-bottom: 6px;
      }

      .config-hint {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .field {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 9px 10px;
        background: #fff;
        color: var(--text);
      }

      .field:focus {
        outline: 2px solid rgba(45, 108, 223, 0.18);
        border-color: var(--blue);
      }

      textarea.field {
        min-height: 92px;
        resize: vertical;
      }

      .remark-form {
        display: grid;
        gap: 12px;
        padding-top: 14px;
      }

      .remark-target {
        color: var(--muted);
        font-size: 13px;
      }

      .remark-hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .group-settings-form {
        display: grid;
        gap: 12px;
        padding-top: 14px;
      }

      .group-settings-target {
        color: var(--muted);
        font-size: 13px;
      }

      .group-settings-hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .group-limit-control {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
      }

      .group-settings-section {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }

      .group-settings-section-title {
        font-weight: 700;
        margin-bottom: 10px;
      }

      .group-settings-checkbox {
        align-items: flex-start;
        line-height: 1.45;
      }

      .group-settings-inline-note {
        color: var(--muted);
        font-size: 12px;
      }

      .cache-strategy-tag {
        margin-left: 6px;
      }

      .strategy-form {
        display: grid;
        gap: 0;
      }

      .strategy-form .config-row:first-child {
        padding-top: 14px;
      }

      .history-modal {
        width: min(1080px, 100%);
      }

      .history-content {
        display: grid;
        gap: 14px;
        padding-top: 14px;
      }

      .history-toolbar {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) minmax(180px, 0.38fr) minmax(180px, 0.5fr);
        gap: 12px;
        align-items: center;
      }

      .custom-select {
        position: relative;
        min-width: 0;
      }

      .select-trigger {
        width: 100%;
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        padding: 9px 11px;
        cursor: pointer;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          color 150ms ease,
          transform 80ms ease;
      }

      .select-trigger:hover,
      .custom-select.open .select-trigger {
        background: #eef4ff;
        border-color: #bfd0f2;
        color: #1d57bb;
      }

      .select-trigger:active {
        background: #dde9ff;
        border-color: #9eb9ee;
        transform: translateY(1px);
      }

      .select-label {
        min-width: 0;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .select-arrow {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 11px;
      }

      .select-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        z-index: 30;
        display: none;
        max-height: 280px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 14px 34px rgba(11, 18, 32, 0.16);
      }

      .custom-select.open .select-menu {
        display: block;
      }

      .select-option {
        width: 100%;
        min-height: 42px;
        display: flex;
        align-items: center;
        gap: 10px;
        border: 0;
        background: #fff;
        color: var(--text);
        padding: 10px 12px;
        cursor: pointer;
        text-align: left;
        transition:
          background 150ms ease,
          color 150ms ease;
      }

      .select-option:hover {
        background: #eef4ff;
        color: #1d57bb;
      }

      .select-option:active,
      .select-option.selected {
        background: #dde9ff;
        color: #194fae;
      }

      .select-option-main {
        min-width: 0;
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
      }

      .select-option-id {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 700;
      }

      .select-option-usage {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .select-option-usage-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 7px;
        min-width: 0;
      }

      .usage-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .usage-search {
        flex: 1 1 auto;
      }

      .usage-sort {
        flex: 0 0 auto;
        width: auto;
        cursor: pointer;
      }

      .select-search {
        width: 100%;
        min-height: 36px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        padding: 8px 12px;
        outline: none;
        box-sizing: border-box;
      }

      .select-search::placeholder {
        color: var(--muted);
      }

      .select-list {
        max-height: 220px;
        overflow: auto;
      }

      .group-remark {
        min-width: 0;
        max-width: 220px;
        min-height: 20px;
        display: inline-flex;
        align-items: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #1d57bb;
        background: #eef4ff;
        border: 1px solid #d4e1fb;
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 12px;
      }

      .sponsor-overlay {
        z-index: 40;
      }

      .sponsor-modal {
        width: min(760px, 92vw);
      }

      .sponsor-content {
        display: grid;
        gap: 16px;
      }

      .sponsor-section-title {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 8px;
      }

      .sponsor-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .sponsor-user-input {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        color: var(--text);
        background: var(--field-bg, rgba(0, 0, 0, 0.03));
        border: 1px solid var(--border, rgba(0, 0, 0, 0.12));
        border-radius: 8px;
        box-sizing: border-box;
      }

      .sponsor-user-input:focus {
        outline: none;
        border-color: var(--accent, #1d57bb);
        box-shadow: 0 0 0 3px rgba(29, 87, 187, 0.15);
      }

      .sponsor-nickname-preview {
        margin-top: 8px;
        min-height: 20px;
        font-size: 14px;
        color: var(--muted);
      }

      .sponsor-nickname-preview.is-loading {
        color: var(--muted);
      }

      .sponsor-nickname-preview strong {
        color: var(--text);
      }

      .sponsor-op {
        flex: 1 1 auto;
        min-width: 120px;
      }

      .sponsor-list-summary {
        color: var(--text);
        font-size: 13px;
        line-height: 1.8;
        word-break: break-all;
      }

      .sponsor-list-summary b {
        color: #1d57bb;
      }

      .managed-overlay {
        z-index: 45;
      }

      .managed-modal {
        width: min(720px, 92vw);
      }

      .managed-content {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .managed-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .managed-search {
        flex: 1 1 auto;
      }

      .managed-count {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .managed-select-all {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        user-select: none;
      }

      .managed-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 60vh;
        overflow-y: auto;
        padding: 2px;
      }

      .managed-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid var(--border, rgba(0, 0, 0, 0.12));
        border-radius: 8px;
        background: var(--field-bg, rgba(0, 0, 0, 0.02));
        box-sizing: border-box;
      }

      .managed-item.is-limited {
        border-color: var(--accent, #1d57bb);
        background: var(--field-bg, rgba(29, 87, 187, 0.06));
      }

      .managed-item input[type="checkbox"] {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        accent-color: var(--accent, #1d57bb);
      }

      .managed-item-info {
        flex: 1 1 auto;
        min-width: 0;
      }

      .managed-item-name {
        color: var(--text);
        font-size: 14px;
        line-height: 1.4;
        word-break: break-all;
      }

      .managed-item-name b {
        color: #1d57bb;
        font-weight: 600;
      }

      .managed-item-remark {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }

      .managed-empty {
        color: var(--muted);
        font-size: 13px;
        padding: 24px;
        text-align: center;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: var(--green);
      }

      .status-dot.fallback {
        background: var(--yellow);
      }

      .status-dot.stopped {
        background: var(--red);
      }

      .history-range-total {
        min-width: 0;
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        overflow: hidden;
        color: var(--text);
        font-size: 24px;
        font-weight: 800;
        line-height: 1;
        text-align: right;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .history-chart-shell {
        min-height: 360px;
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr);
        grid-template-rows: minmax(270px, 1fr) auto;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fff;
      }

      .history-y-axis {
        grid-column: 1;
        grid-row: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: flex-end;
        padding: 4px 0 28px;
        color: var(--muted);
        font-size: 12px;
      }

      .history-chart {
        grid-column: 2;
        grid-row: 1;
        min-width: 0;
        min-height: 270px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        overflow: hidden;
        border-left: 1px solid #edf1f6;
        border-bottom: 1px solid #dce2ea;
        padding: 22px 8px 0;
      }

      .history-bar-item {
        min-width: 0;
        height: 100%;
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
      }

      .history-bar-value {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
        font-size: 12px;
      }

      .history-bar {
        width: min(32px, 74%);
        min-height: 2px;
        border-radius: 6px 6px 0 0;
        background: var(--blue);
        cursor: pointer;
        transition:
          height 320ms ease,
          background 150ms ease,
          transform 80ms ease,
          box-shadow 150ms ease;
      }

      .history-bar:hover {
        background: #1f5fcf;
        box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.14);
      }

      .history-bar:active {
        background: #194fae;
        transform: translateY(1px);
      }

      .history-x-axis {
        grid-column: 2;
        grid-row: 2;
        min-width: 0;
        display: flex;
        gap: 8px;
        padding: 0 8px;
      }

      .history-x-label {
        min-width: 0;
        flex: 1 1 0;
        overflow: hidden;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
        font-size: 12px;
      }

      .history-empty {
        width: 100%;
        margin: auto;
        align-self: center;
        text-align: center;
        color: var(--muted);
      }

      .history-footer {
        color: var(--muted);
        font-size: 12px;
      }

      .user-usage-toolbar {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) auto minmax(220px, 0.7fr);
        gap: 12px;
        align-items: center;
      }

      .user-usage-refresh {
        min-height: 40px;
        padding: 9px 16px;
        white-space: nowrap;
      }

      .user-usage-window {
        min-width: 0;
        color: var(--muted);
        font-size: 13px;
        text-align: right;
      }

      .user-usage-chart-shell {
        min-height: 380px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fff;
      }

      .user-usage-chart {
        min-height: 330px;
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .user-usage-row {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        column-gap: 8px;
        align-items: center;
      }

      .user-usage-label {
        width: var(--user-usage-label-width, max-content);
        max-width: 220px;
        overflow: hidden;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .user-usage-bar-track {
        min-width: 0;
        height: 28px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
      }

      .user-usage-bar {
        height: 16px;
        width: 0%;
        border-radius: 8px;
        background: var(--blue);
        cursor: pointer;
        transition:
          width 320ms ease,
          background 150ms ease,
          transform 80ms ease,
          box-shadow 150ms ease;
      }

      .user-usage-bar:hover {
        background: #1f5fcf;
        box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.14);
      }

      .user-usage-bar:active {
        background: #194fae;
        transform: translateY(1px);
      }

      .user-usage-bar.over-limit {
        background: var(--red);
      }

      .user-usage-bar.over-limit:hover {
        background: #b91c1c;
      }

      .user-usage-value {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .user-usage-value.over-limit {
        color: var(--red);
      }

      .dialog-modal {
        width: min(760px, 100%);
        max-height: min(640px, calc(100vh - 48px));
      }

      .dialog-overlay {
        z-index: 45;
      }

      .dialog-content {
        display: grid;
        gap: 12px;
        padding-top: 14px;
      }

      .dialog-user {
        color: var(--muted);
        font-size: 13px;
      }

      .dialog-table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .dialog-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .dialog-table th,
      .dialog-table td {
        border-bottom: 1px solid #edf1f6;
        padding: 10px 12px;
        text-align: left;
        vertical-align: middle;
        font-size: 13px;
      }

      .dialog-table th {
        background: #f8fafc;
        color: var(--text);
        font-weight: 800;
        white-space: nowrap;
      }

      .dialog-table tr:last-child td {
        border-bottom: 0;
      }

      .dialog-text-cell {
        width: 52%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .dialog-prompt-wrap {
        min-width: 0;
        max-width: 100%;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        vertical-align: middle;
      }

      .dialog-quote-tag {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        height: 20px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        background: #f1f5f9;
        color: #475569;
        padding: 0 6px;
        font-size: 12px;
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
      }

      .dialog-prompt-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .dialog-number-cell,
      .dialog-time-cell {
        width: 24%;
        white-space: nowrap;
      }

      .dialog-sort-button {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 0;
        background: transparent;
        color: inherit;
        padding: 0;
        cursor: pointer;
        font-weight: 800;
      }

      .dialog-sort-button:hover {
        color: var(--blue);
      }

      .dialog-sort-button:active {
        color: #194fae;
      }

      .dialog-close-button {
        width: 32px;
        height: 32px;
        padding: 0;
        font-size: 20px;
        line-height: 1;
      }

      .history-tooltip {
        position: fixed;
        z-index: 60;
        display: none;
        padding: 9px 11px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        box-shadow: 0 12px 28px rgba(11, 18, 32, 0.18);
        pointer-events: none;
        white-space: nowrap;
        width: max-content;
      }

      .history-tooltip.open {
        display: grid;
        gap: 4px;
      }

      .history-tooltip-line {
        display: block;
        overflow: visible;
        color: var(--text);
        font-size: 13px;
        line-height: 1.25;
        text-overflow: clip;
        white-space: nowrap;
      }

      .history-tooltip-value {
        font-weight: 800;
      }

      .switch {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
      }

      .switch input {
        width: 18px;
        height: 18px;
      }

      .toast {
        min-height: 20px;
        color: var(--muted);
        font-size: 13px;
      }

      .toast.error {
        color: var(--red);
      }

      .toast.warning {
        color: var(--yellow-dark);
      }

      @media (max-width: 860px) {
        .app {
          padding: 14px;
        }

        .layout,
        .config-row,
        .history-toolbar,
        .user-usage-toolbar,
        .user-usage-row {
          grid-template-columns: 1fr;
        }

        .user-usage-window {
          text-align: left;
        }

        .user-usage-label {
          width: auto;
          max-width: none;
        }

        .modal {
          max-height: calc(100vh - 28px);
        }

        .history-chart-shell {
          min-height: 320px;
          grid-template-columns: 46px minmax(0, 1fr);
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="layout">
        <section class="panel">
          <div class="panel-header">
            <div>
              <h1 class="panel-title">用量统计</h1>
              <p id="windowText" class="panel-subtitle"></p>
            </div>
            <button id="refreshBtn" class="action-button" type="button">刷新</button>
          </div>
          <div class="usage-toolbar">
            <input
              id="usageSearch"
              class="field usage-search"
              type="text"
              placeholder="搜索群号 / 备注 ..."
            />
            <select
              id="usageSort"
              class="field usage-sort"
              title="排序方式"
              aria-label="排序方式"
            >
              <option value="usage_desc">用量从高到低</option>
              <option value="usage_asc">用量从低到高</option>
              <option value="group_id_asc">群号升序</option>
              <option value="group_name_asc">群名升序</option>
            </select>
          </div>
          <div id="usageList" class="usage-list"></div>
        </section>

        <aside class="panel">
          <div class="panel-header">
            <div>
              <h2 class="panel-title">插件功能</h2>
            </div>
          </div>
          <div class="feature-body">
            <button id="openConfigBtn" class="config-button" type="button">
              插件基础配置 ...
            </button>
            <button id="openStrategyBtn" class="strategy-button" type="button">
              用量超限策略配置
            </button>
            <button id="openHistoryBtn" class="strategy-button" type="button">
              历史 token 用量统计
            </button>
            <button id="openUserUsageBtn" class="strategy-button" type="button">
              今日用户 token 用量统计
            </button>
            <button id="openSponsorBtn" class="strategy-button" type="button">
              赞助用户管理
            </button>
            <button id="openLimitedGroupsBtn" class="strategy-button" type="button">
              限流的 QQ 群聊列表
            </button>
            <div id="statusLine" class="status-line"></div>
          </div>
        </aside>
      </section>
    </main>

    <div id="overlay" class="overlay" role="dialog" aria-modal="true">
      <section class="modal">
        <div class="modal-topbar">
          <div class="modal-title">插件配置</div>
          <div class="modal-actions">
            <button id="saveBtn" class="action-button primary" type="button">
              保存
            </button>
            <button id="cancelBtn" class="action-button" type="button">取消</button>
          </div>
        </div>
        <div class="modal-content">
          <div id="configForm"></div>
          <div id="toast" class="toast"></div>
        </div>
      </section>
    </div>

    <div id="strategyOverlay" class="overlay" role="dialog" aria-modal="true">
      <section class="modal">
        <div class="modal-topbar">
          <div class="modal-title">用量超限时的措施</div>
          <div class="modal-actions">
            <button id="saveStrategyBtn" class="action-button primary" type="button">
              保存
            </button>
            <button id="cancelStrategyBtn" class="action-button" type="button">取消</button>
          </div>
        </div>
        <div class="modal-content">
          <div id="strategyForm" class="strategy-form"></div>
          <div id="strategyToast" class="toast"></div>
        </div>
      </section>
    </div>

    <div id="historyOverlay" class="overlay" role="dialog" aria-modal="true">
      <section class="modal history-modal">
        <div class="modal-topbar">
          <div class="modal-title">历史 token 用量统计</div>
          <div class="modal-actions">
            <button id="cancelHistoryBtn" class="action-button" type="button">关闭</button>
          </div>
        </div>
        <div class="modal-content history-content">
          <div class="history-toolbar">
            <div id="groupSelect" class="custom-select">
              <button id="groupSelectTrigger" class="select-trigger" type="button">
                <span id="groupSelectLabel" class="select-label">选择群聊 ...</span>
                <span class="select-arrow">▼</span>
              </button>
              <div id="groupSelectMenu" class="select-menu">
                <input
                  id="groupSelectSearch"
                  class="select-search"
                  type="text"
                  placeholder="搜索群号 / 备注 ..."
                />
                <div id="groupSelectList" class="select-list"></div>
              </div>
            </div>
            <div id="rangeSelect" class="custom-select">
              <button id="rangeSelectTrigger" class="select-trigger" type="button">
                <span id="rangeSelectLabel" class="select-label">近 24 小时</span>
                <span class="select-arrow">▼</span>
              </button>
              <div id="rangeSelectMenu" class="select-menu"></div>
            </div>
            <div
              id="historyRangeTotal"
              class="history-range-total"
              aria-live="polite"
            ></div>
          </div>
          <div class="history-chart-shell">
            <div id="historyYAxis" class="history-y-axis"></div>
            <div id="historyChart" class="history-chart"></div>
            <div id="historyXAxis" class="history-x-axis"></div>
          </div>
          <div id="historyFooter" class="history-footer"></div>
        </div>
      </section>
    </div>

    <div id="userUsageOverlay" class="overlay" role="dialog" aria-modal="true">
      <section class="modal history-modal">
        <div class="modal-topbar">
          <div class="modal-title">今日用户 token 用量统计</div>
          <div class="modal-actions">
            <button id="cancelUserUsageBtn" class="action-button" type="button">关闭</button>
          </div>
        </div>
        <div class="modal-content history-content">
          <div class="user-usage-toolbar">
            <div id="userGroupSelect" class="custom-select">
              <button id="userGroupSelectTrigger" class="select-trigger" type="button">
                <span id="userGroupSelectLabel" class="select-label">选择群聊 ...</span>
                <span class="select-arrow">▼</span>
              </button>
              <div id="userGroupSelectMenu" class="select-menu">
                <input
                  id="userGroupSelectSearch"
                  class="select-search"
                  type="text"
                  placeholder="搜索群号 / 备注 ..."
                />
                <div id="userGroupSelectList" class="select-list"></div>
              </div>
            </div>
            <button
              id="refreshUserUsageBtn"
              class="action-button user-usage-refresh"
              type="button"
            >
              刷新
            </button>
            <div id="userUsageWindow" class="user-usage-window"></div>
          </div>
          <div class="user-usage-chart-shell">
            <div id="userUsageChart" class="user-usage-chart">
              <div class="history-empty">请选择群聊查看今日用户 token 用量</div>
            </div>
          </div>
          <div id="userUsageFooter" class="history-footer"></div>
        </div>
      </section>
    </div>

    <div id="sponsorOverlay" class="overlay sponsor-overlay" role="dialog" aria-modal="true">
      <section class="modal sponsor-modal">
        <div class="modal-topbar">
          <div class="modal-title">赞助用户管理</div>
          <div class="modal-actions">
            <button id="cancelSponsorBtn" class="action-button" type="button">关闭</button>
          </div>
        </div>
        <div class="modal-content sponsor-content">
          <div class="sponsor-section">
            <div class="sponsor-section-title">输入 QQ 号码</div>
            <input
              id="sponsorUserInput"
              class="sponsor-user-input"
              type="text"
              placeholder="请输入 QQ 号码，例如 123456789"
              inputmode="numeric"
              autocomplete="off"
            />
            <div id="sponsorNicknamePreview" class="sponsor-nickname-preview"></div>
          </div>
          <div class="sponsor-actions">
            <button id="sponsorAddBtn" class="action-button primary sponsor-op" type="button">
              添加为赞助
            </button>
            <button id="sponsorRemoveBtn" class="action-button sponsor-op" type="button">
              移除赞助
            </button>
            <button id="sponsorSuperBtn" class="action-button sponsor-op" type="button">
              设为超级管理员
            </button>
            <button id="sponsorUnsuperBtn" class="action-button sponsor-op" type="button">
              移除超级管理员
            </button>
          </div>
          <div id="sponsorToast" class="toast"></div>
          <div class="sponsor-footer">
            <div id="sponsorListSummary" class="sponsor-list-summary"></div>
          </div>
        </div>
      </section>
    </div>

    <div id="limitedGroupsOverlay" class="overlay managed-overlay" role="dialog" aria-modal="true">
      <section class="modal managed-modal">
        <div class="modal-topbar">
          <div class="modal-title">限流的 QQ 群聊列表</div>
          <div class="modal-actions">
            <label class="managed-select-all">
              <input id="managedSelectAll" type="checkbox" /> 全选
            </label>
            <button id="saveLimitedGroupsBtn" class="action-button primary" type="button">
              保存
            </button>
            <button id="cancelLimitedGroupsBtn" class="action-button" type="button">关闭</button>
          </div>
        </div>
        <div class="modal-content managed-content">
          <div class="managed-toolbar">
            <input
              id="managedSearch"
              class="field managed-search"
              type="text"
              placeholder="搜索群名 / 群号 / 备注 ..."
            />
            <span id="managedCount" class="managed-count"></span>
          </div>
          <div id="managedList" class="managed-list"></div>
          <div id="managedToast" class="toast"></div>
        </div>
      </section>
    </div>

    <div id="userDialogOverlay"
      class="overlay dialog-overlay"
      role="dialog"
      aria-modal="true"
    >
      <section class="modal dialog-modal">
        <div class="modal-topbar">
          <div class="modal-title">对话数据</div>
          <div class="modal-actions">
            <button
              id="closeUserDialogBtn"
              class="action-button dialog-close-button"
              type="button"
              aria-label="关闭"
            >
              ×
            </button>
          </div>
        </div>
        <div class="modal-content dialog-content">
          <div id="userDialogTarget" class="dialog-user"></div>
          <div class="dialog-table-wrap">
            <table class="dialog-table">
              <thead>
                <tr>
                  <th class="dialog-text-cell">对话</th>
                  <th class="dialog-number-cell">
                    <button
                      id="sortUserDialogTokensBtn"
                      class="dialog-sort-button"
                      type="button"
                    >
                      用量<span id="sortUserDialogTokensIcon"></span>
                    </button>
                  </th>
                  <th class="dialog-time-cell">
                    <button
                      id="sortUserDialogTimeBtn"
                      class="dialog-sort-button"
                      type="button"
                    >
                      时间<span id="sortUserDialogTimeIcon"></span>
                    </button>
                  </th>
                </tr>
              </thead>
              <tbody id="userDialogTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <div id="remarkOverlay" class="overlay compact" role="dialog" aria-modal="true">
      <section class="modal">
        <div class="modal-topbar">
          <div class="modal-title">群聊备注</div>
          <div class="modal-actions">
            <button id="saveRemarkBtn" class="action-button primary" type="button">
              保存
            </button>
            <button id="cancelRemarkBtn" class="action-button" type="button">取消</button>
          </div>
        </div>
        <div class="modal-content">
          <div class="remark-form">
            <div id="remarkTarget" class="remark-target"></div>
            <input
              id="remarkInput"
              class="field"
              type="text"
              maxlength="64"
              placeholder="输入备注名"
            />
            <div id="remarkToast" class="toast"></div>
          </div>
        </div>
      </section>
    </div>

    <div id="groupSettingsOverlay" class="overlay compact" role="dialog" aria-modal="true">
      <section class="modal">
        <div class="modal-topbar">
          <div class="modal-title">群聊个性化配置</div>
          <div class="modal-actions">
            <button id="saveGroupSettingsBtn" class="action-button primary" type="button">
              保存
            </button>
            <button id="cancelGroupSettingsBtn" class="action-button" type="button">
              取消
            </button>
          </div>
        </div>
        <div class="modal-content">
          <div class="group-settings-form">
            <div id="groupSettingsTarget" class="group-settings-target"></div>
            <div>
              <div class="config-name">单独配置本群每日用量上限</div>
              <div class="group-limit-control">
                <input
                  id="groupLimitInput"
                  class="field"
                  type="number"
                  min="0"
                  step="1"
                />
                <button id="resetGroupLimitBtn" class="action-button" type="button" disabled>
                  重置
                </button>
              </div>
            </div>
            <div id="groupSettingsHint" class="group-settings-hint"></div>
            <div class="group-settings-section">
              <div class="group-settings-section-title">本群 token 节约策略</div>
              <label class="switch group-settings-checkbox">
                <input id="groupOnlyAtBotInput" type="checkbox" />
                <span>仅通过 @bot 触发 LLM 回复</span>
              </label>
              <label class="switch group-settings-checkbox">
                <input id="groupContextLimitInput" type="checkbox" />
                <span>
                  最大上下文窗口设置为额度的 0.5%
                  <span id="groupContextLimitValue" class="group-settings-inline-note"></span>
                </span>
              </label>
              <label class="switch group-settings-checkbox">
                <input id="groupPromptCacheInput" type="checkbox" />
                <span>
                  通过稳定缓存键提升缓存命中率
                  <span class="group-settings-inline-note cache-strategy-tag">GPT 专用</span>
                </span>
              </label>
              <label class="switch group-settings-checkbox">
                <input id="groupDeepSeekCacheInput" type="checkbox" />
                <span>
                  通过稳定前缀提升缓存命中率
                  <span class="group-settings-inline-note cache-strategy-tag">DeepSeek 专用</span>
                </span>
              </label>
            </div>
            <div id="groupSettingsToast" class="toast"></div>
          </div>
        </div>
      </section>
    </div>

    <div id="historyTooltip" class="history-tooltip" role="status" aria-live="polite">
      <span id="historyTooltipLabel" class="history-tooltip-line"></span>
      <span
        id="historyTooltipValue"
        class="history-tooltip-line history-tooltip-value"
      ></span>
    </div>

    <script>
      const api = window.AstrBotPluginPage;
      const state = {

          superAdminUsers: [],
        },
        managed: {

          groups: [],
          search: "",
          selected: new Set(),
        },
      };

      const usageList = document.getElementById("usageList");
      const windowText = document.getElementById("windowText");
      const statusLine = document.getElementById("statusLine");
      const overlay = document.getElementById("overlay");
      const strategyOverlay = document.getElementById("strategyOverlay");
      const historyOverlay = document.getElementById("historyOverlay");
      const userUsageOverlay = document.getElementById("userUsageOverlay");
      const userDialogOverlay = document.getElementById("userDialogOverlay");
      const remarkOverlay = document.getElementById("remarkOverlay");
      const groupSettingsOverlay = document.getElementById("groupSettingsOverlay");
      const configForm = document.getElementById("configForm");
      const strategyForm = document.getElementById("strategyForm");
      const toast = document.getElementById("toast");
      const strategyToast = document.getElementById("strategyToast");
      const groupSelect = document.getElementById("groupSelect");
      const groupSelectTrigger = document.getElementById("groupSelectTrigger");
      const groupSelectLabel = document.getElementById("groupSelectLabel");

      function groupContextLimitDisplay(limitTokens) {
        const tokens = groupContextLimitTokens(limitTokens);
        if (tokens >= 1000000) return `${(tokens / 1000000).toFixed(2)}M`;
        return `${Math.max(1, Math.round(tokens / 1000))}K`;
      }

      function groupContextLimitTokens(limitTokens) {
        return Math.max(1, Math.floor(Number(limitTokens || 0) * 0.005));
      }

      function currentGroupContextLimitTokens() {
        const value = Number.parseInt(groupLimitInput.value || "0", 10);
        const limitTokens = Number.isNaN(value) ? 0 : value;
        return groupContextLimitTokens(limitTokens);
      }

      function groupContextLimitWarningMessage() {
        if (!groupContextLimitInput.checked) return "";
        const tokens = currentGroupContextLimitTokens();
        if (tokens < 15000) {
          return "警告：LLM 上下文窗口过短，可能显著降低 bot 记忆能力。";
        }
        if (tokens >= 200000) {
          return "警告：LLM 上下文窗口较长，可能显著增加 token 用量。";
        }
        return "";
      }

        if (!groupPromptCacheInput.checked && !groupDeepSeekCacheInput.checked) return "";
        return "警告：请确认没有同时启用会修改 LLM 请求体的其他插件。";

      function formatDate(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        const pad = (num) => String(num).padStart(2, "0");
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      function normalizeListText(value) {
        if (Array.isArray(value)) return value.join("\n");
        return normalizeTextareaText(value);
      }

      function normalizeTextareaText(value) {
        return String(value || "").replace(/\\n/g, "\n");
      }

      function parseListText(value) {
        return String(value || "")
          .split(/[\s,;，；]+/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function inputTypeFor(meta) {
        if (meta.type === "int" || meta.type === "float") return "number";
        return "text";
      }

      function optionLabel(meta, option, index) {
        if (Array.isArray(meta.option_labels) && meta.option_labels[index]) {
          return meta.option_labels[index];
        }
        return option;
      }

      function renderConfigControl(key, meta, draft, onChange) {
        const control = document.createElement("div");
        if (meta.options) {
          const select = document.createElement("select");
          select.className = "field";
          const originalOptions = Array.isArray(meta.options) ? meta.options : [];
          const options = [...originalOptions];
          const currentValue = draft[key] ?? meta.default ?? "";
          if (currentValue && !options.includes(currentValue)) {
            options.unshift(currentValue);
          }
          if (!options.length) {
            const item = document.createElement("option");
            item.value = "";
            item.textContent = "暂无可用选项";
            select.append(item);
          }
          options.forEach((option, index) => {
            const item = document.createElement("option");
            const originalIndex = originalOptions.indexOf(option);
            item.value = option;
            item.textContent =
              originalIndex >= 0 ? optionLabel(meta, option, originalIndex) : option;
            select.append(item);
          });
          select.value = currentValue;
          select.addEventListener("change", () => {
            draft[key] = select.value;
            if (onChange) onChange(key, select.value);
          });
          control.append(select);
        } else if (meta.type === "bool") {
          const label = document.createElement("label");
          label.className = "switch";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = Boolean(draft[key]);
          input.addEventListener("change", () => {
            draft[key] = input.checked;
            if (onChange) onChange(key, input.checked);
          });
          const text = document.createElement("span");
          text.textContent = input.checked ? "启用" : "关闭";
          input.addEventListener("change", () => {
            text.textContent = input.checked ? "启用" : "关闭";
          });
          label.append(input, text);
          control.append(label);
        } else if (meta.type === "list") {
          const textarea = document.createElement("textarea");
          textarea.className = "field";
          textarea.value = normalizeListText(draft[key]);
          textarea.addEventListener("input", () => {
            draft[key] = parseListText(textarea.value);
            if (onChange) onChange(key, draft[key]);
          });
          control.append(textarea);
        } else if (meta.type === "text") {
          const textarea = document.createElement("textarea");
          textarea.className = "field";
          textarea.value = normalizeTextareaText(draft[key]);
          textarea.addEventListener("input", () => {
            draft[key] = textarea.value;
            if (onChange) onChange(key, textarea.value);
          });
          control.append(textarea);
        } else {
          const input = document.createElement("input");
          input.className = "field";
          input.type = inputTypeFor(meta);
          input.value = draft[key] ?? "";
          if (meta.type === "int") input.step = "1";
          input.addEventListener("input", () => {
            draft[key] =
              meta.type === "int" ? Number.parseInt(input.value || "0", 10) : input.value;
            if (onChange) onChange(key, draft[key]);
          });
          control.append(input);
        }
        return control;
      }

      function sortUsageGroups(list) {
        const key = state.usageSort || "usage_desc";
        const collator = new Intl.Collator("zh-Hans-CN", {
          numeric: true,
          sensitivity: "base",
        });
        list.sort((a, b) => {
          if (key === "usage_desc") {
            return (b.used_tokens || 0) - (a.used_tokens || 0);
          }
          if (key === "usage_asc") {
            return (a.used_tokens || 0) - (b.used_tokens || 0);
          }
          if (key === "group_id_asc") {
            return collator.compare(String(a.group_id || ""), String(b.group_id || ""));
          }
          return collator.compare(String(a.group_name || ""), String(b.group_name || ""));
        });
      }

          : groups.slice();

        filteredGroups.forEach((group) => {

            groupText.append(groupRemark);

          const remarkButton = document.createElement("button");

          remarkButton.title = "编辑备注";
          remarkButton.setAttribute("aria-label", `编辑 ${groupDisplayText(group)} 的备注`);
          remarkButton.append(createPencilIcon());
          remarkButton.addEventListener("click", () => {
            openRemark(group.group_id, group.remark || "");

          const settingsButton = document.createElement("button");
          settingsButton.className = "icon-button";
          settingsButton.type = "button";
          settingsButton.title = "群聊个性化配置";
          settingsButton.setAttribute(

          settingsButton.append(createGearIcon());
          settingsButton.addEventListener("click", () => {
            openGroupSettings(group);
          });

          groupInfo.append(groupText, remarkButton, settingsButton);

          const usageSide = document.createElement("div");
          usageSide.className = "usage-side";
          if (group.stopped) {
            const stopTag = document.createElement("div");
            stopTag.className = "stop-tag";
            stopTag.textContent = "停止响应";
            usageSide.append(stopTag);
          } else if (group.using_fallback) {
            const fallbackTag = document.createElement("div");
            fallbackTag.className = "fallback-tag";
            fallbackTag.textContent = "回退模型";
            usageSide.append(fallbackTag);
          }

          const value = document.createElement("div");
          value.className = "usage-value";
          if (group.stopped) {
            value.classList.add("stopped");
          } else if (group.using_fallback) {
            value.classList.add("fallback");
          }
          value.textContent = `${group.used_display}/${group.limit_display}`;
          usageSide.append(value);

          track.className = "progress-track";
          const fill = document.createElement("div");
          fill.className = `progress-fill${group.stopped ? " stopped" : ""}${!group.stopped && group.using_fallback ? " fallback" : ""}`;
          fill.style.width = `${Math.max(0, Math.min(100, group.percent || 0))}%`;
          track.append(fill);

          row.append(meta, track);
          usageList.append(row);

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

        try {
          const payload = await api.apiGet("user-name", { user_id: userId });
          const nickname = payload.nickname || "";
          state.sponsor.nickname = nickname;
          if (nickname) state.sponsor.userNames[userId] = nickname;

            ? `昵称：<strong>${escapeHtml(nickname)}</strong>`

        const userId = state.sponsor.currentUser;

      async function loadManagedGroups() {
        const payload = await api.apiGet("managed-groups");
        state.managed.groups = payload.groups || [];

        renderManagedList();

      function renderManagedList() {
        const query = String(state.managed.search || "").trim().toLowerCase();
        const groups = query
          ? state.managed.groups.filter((group) => managedSearchText(group).includes(query))
          : state.managed.groups;

        managedCount.textContent = `已选 ${state.managed.selected.size} / ${state.managed.groups.length}`;
        managedList.innerHTML = "";
        if (!groups.length) {
          const empty = document.createElement("div");
          empty.className = "managed-empty";
          empty.textContent = query ? "没有匹配的 QQ 群聊" : "未获取到任何 QQ 群聊";
          managedList.append(empty);
          managedSelectAll.disabled = true;
          managedSelectAll.checked = false;
          return;
        }
        managedSelectAll.disabled = false;
        const allVisibleSelected = groups.every((group) =>
          state.managed.selected.has(group.group_id),
        );
        managedSelectAll.checked = allVisibleSelected;

        groups.forEach((group) => {
          const item = document.createElement("label");
          item.className = "managed-item";
          if (state.managed.selected.has(group.group_id)) {
            item.classList.add("is-limited");
          }
          item.setAttribute("data-group-id", group.group_id);

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = state.managed.selected.has(group.group_id);

          const info = document.createElement("div");
          info.className = "managed-item-info";

          const name = document.createElement("div");
          name.className = "managed-item-name";
          const escapedName = escapeHtml(group.group_name || "");
          name.innerHTML = escapedName
            ? `${escapedName}<b>（${escapeHtml(group.group_id)}）</b>`
            : escapeHtml(group.group_id);
          info.append(name);

          if (group.remark) {
            const remark = document.createElement("div");
            remark.className = "managed-item-remark";
            remark.textContent = `备注：${group.remark}`;
            info.append(remark);
          }

          checkbox.addEventListener("change", () => {
            if (checkbox.checked) {
              state.managed.selected.add(group.group_id);
              item.classList.add("is-limited");
            } else {
              state.managed.selected.delete(group.group_id);
              item.classList.remove("is-limited");
            }
            managedCount.textContent = `已选 ${state.managed.selected.size} / ${state.managed.groups.length}`;
            const visible = state.managed.groups.filter((g) => {
              const search = String(state.managed.search || "").trim().toLowerCase();
              return search ? managedSearchText(g).includes(search) : true;
            });
            managedSelectAll.checked =
              visible.length > 0 &&
              visible.every((g) => state.managed.selected.has(g.group_id));
          });

          item.append(checkbox, info);
          managedList.append(item);
        });
      }

      function sortUserDialog(key) {
        if (state.userUsage.dialogSortKey === key) {
          state.userUsage.dialogSortDirection =
            state.userUsage.dialogSortDirection === "asc" ? "desc" : "asc";
        } else {
          state.userUsage.dialogSortKey = key;
          state.userUsage.dialogSortDirection = key === "time" ? "desc" : "desc";

        renderUserDialog();

      function sortedUserDialogs() {
        const dialogs = [...(state.userUsage.dialogUser?.dialogs || [])];
        const key = state.userUsage.dialogSortKey || "time";
        const direction = state.userUsage.dialogSortDirection === "asc" ? 1 : -1;
        dialogs.sort((left, right) => {
          let leftValue;
          let rightValue;
          if (key === "tokens") {
            leftValue = Number(left.tokens || 0);
            rightValue = Number(right.tokens || 0);
          } else {
            leftValue = new Date(left.created_at || 0).getTime();
            rightValue = new Date(right.created_at || 0).getTime();
          }
          if (leftValue === rightValue) return 0;
          return leftValue > rightValue ? direction : -direction;
        });
        return dialogs;
      }

      function renderHistoryTotal() {
        const totalText =
          state.history.selectedGroupId && state.history.rangeTotalDisplay
